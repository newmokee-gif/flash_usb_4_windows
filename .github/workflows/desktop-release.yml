name: Windows and GNU Linux all-platform release
on:
  push:
    branches: [linux-support]
    tags: [v0.3.0]
    paths:
      - прога/**
      - packaging/**
      - tests/**
      - scripts/publish_multios.py
      - .github/workflows/**
      - '!прога/distro_catalog.py'
      - '!tests/test_distro_catalog.py'
      - '!.github/workflows/catalog-check.yml'
      - '!tests/smoke_raw_macos.py'
      - '!.github/workflows/macos-raw-check.yml'
      - '!.github/workflows/validation-queue.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official catalogue sources and checksum coverage
        run: |
          set +e
          python scripts/verify_distro_catalog.py 2>&1 | tee catalogue-check.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python -c 'from pathlib import Path; t=Path("catalogue-check.log").read_text(errors="replace")[-3500:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-verification
          path: catalogue-check.log
  linux:
    uses: ./.github/workflows/linux.yml
  packages:
    permissions:
      contents: write
    uses: ./.github/workflows/packages.yml
  appimage:
    permissions:
      contents: write
    uses: ./.github/workflows/appimage.yml
  linux-arm:
    permissions:
      contents: write
    uses: ./.github/workflows/linux-arm.yml
  macos:
    permissions:
      contents: write
    uses: ./.github/workflows/macos.yml
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            arch: ARM64
            python: arm64
          - runner: windows-2025
            arch: x64
            python: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python }}
      - run: python -m pip install PyInstaller==6.22.3
      - name: Native Windows policy, download and disk discovery checks
        shell: pwsh
        run: |
          $result = 0
          foreach ($pattern in @('test_package_manager_ui.py', 'test_windows_arm.py', 'test_raw_usb.py', 'test_image_download.py', 'test_distro_catalog.py')) {
            python -m unittest discover -s tests -p $pattern -v 2>&1 | Tee-Object -FilePath native-tests.log -Append
            if ($LASTEXITCODE -ne 0) { $result = $LASTEXITCODE; break }
          }
          if ($result -eq 0) {
            python tests/smoke_raw_windows.py 2>&1 | Tee-Object -FilePath native-tests.log -Append
            $result = $LASTEXITCODE
          }
          if ($result -ne 0) {
            python -c 'from pathlib import Path; t=Path("native-tests.log").read_text(errors="replace")[-3500:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          }
          exit $result
      - name: Verify official aria2 helper on the native Windows host
        shell: pwsh
        run: |
          python -X utf8 -c 'import sys, subprocess; sys.path.insert(0,"прога"); from image_download import ensure_windows_aria2; executable=ensure_windows_aria2(log=print, allow_emulation=True); result=subprocess.run([executable,"--no-conf=true","--version"], text=True, capture_output=True, timeout=30, check=True); print(result.stdout); assert "BitTorrent" in result.stdout' 2>&1 | Tee-Object -FilePath aria-verification.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            python -X utf8 -c 'from pathlib import Path; t=Path("aria-verification.log").read_text(errors="replace")[-3500:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          }
          exit $result
      - name: Download and verify official WinGet packages without installing
        shell: pwsh
        run: |
          python -c 'import sys; from pathlib import Path; sys.path.insert(0,"прога"); from winget_install import SCRIPT; Path("verify-winget.ps1").write_text("$verifyOnly = $true\n$aria = $null\n" + SCRIPT, encoding="utf-8-sig")'
          powershell.exe -NoProfile -File verify-winget.ps1 2>&1 | Tee-Object -FilePath winget-verification.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            python -c 'from pathlib import Path; t=Path("winget-verification.log").read_text(errors="replace")[-3000:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          }
          exit $result
      - name: Build and check native GUI
        shell: pwsh
        run: |
          python packaging/windows/build_arm64.py --arch '${{ matrix.arch }}' --output desktop-dist 2>&1 | Tee-Object -FilePath desktop-build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            python -c 'from pathlib import Path; t=Path("desktop-build.log").read_text(errors="replace")[-3000:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          }
          exit $result
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: desktop-dist/*
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/tags/v0.3.0'
    needs: [catalog, linux, macos, windows, packages, appimage, linux-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-windows-*
          path: desktop-dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: desktop-dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: desktop-dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: desktop-dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-appimage
          path: desktop-dist
      - name: Verify and publish all platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          python scripts/publish_multios.py 2>&1 | tee publication.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python -c 'from pathlib import Path; t=Path("publication.log").read_text(errors="replace")[-3500:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
