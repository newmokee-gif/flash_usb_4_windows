name: Restart the unassigned Apple Silicon recovery attempt
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restart-recovery.yml
      - scripts/restart_recovery.py
      - tests/test_restart_recovery.py
permissions:
  contents: read
concurrency:
  group: one-off-restart-recovery-40380872693
  cancel-in-progress: false
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Test restart safety guards offline
        run: python -m unittest discover -s tests -p test_restart_recovery.py -v
      - name: Replace only the confirmed unassigned attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          python scripts/restart_recovery.py 2>&1 | tee restart-recovery.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python -c 'from pathlib import Path; t=Path("restart-recovery.log").read_text(errors="replace")[-4000:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
