name: Retire superseded development checks
on:
  push:
    branches: [linux-support]
    paths: [.github/workflows/validation-queue.yml]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel only known superseded checks from this development task
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          expected = {
              40368484494: '3c590fc', 40369063958: 'c821115',
              40370222492: '68486d4', 40370936911: 'eb97b91',
              40371947804: '3a2522e', 40372666468: '23014d6',
          }
          repo = os.environ['GH_REPO']
          if repo != 'newmokee-gif/flash_usb_4_windows':
              raise RuntimeError('Unexpected repository')
          for run_id, commit in expected.items():
              endpoint = f'repos/{repo}/actions/runs/{run_id}'
              run = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
              if (run['head_branch'] != 'linux-support' or run['event'] != 'push'
                      or not run['head_sha'].startswith(commit)
                      or run['path'] != '.github/workflows/desktop-release.yml'):
                  raise RuntimeError(f'Unexpected run identity: {run_id}')
              print(f'::notice::Superseded check {run_id}: {commit}, {run["status"]}', flush=True)
              if run['status'] in ('queued', 'in_progress', 'waiting', 'pending'):
                  subprocess.run(['gh', 'api', endpoint + '/cancel', '--method', 'POST'], check=True)
          current = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/actions/runs/40374485299/jobs?per_page=100'], text=True))
          for job in current['jobs']:
              if 'macOS' in job['name']:
                  detail = {key: job.get(key) for key in ('name', 'status', 'conclusion', 'started_at', 'runner_name', 'labels')}
                  print('::notice::Current native job: ' + json.dumps(detail), flush=True)
          PY
