name: Translate documented release notes
on:
  push:
    branches: [main]
    paths:
      - docs/releases/**
      - scripts/translate_release_notes.py
      - .github/workflows/translate-release-notes.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: translate-release-notes
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test metadata translation
        run: |
          set +e
          python -m unittest discover -s tests -p test_translate_release_notes.py -v 2>&1 | tee tests.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python -c 'from pathlib import Path; t=Path("tests.log").read_text(errors="replace")[-3500:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
      - name: Update titles and descriptions without changing binaries or visibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          python scripts/translate_release_notes.py 2>&1 | tee translation.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python -c 'from pathlib import Path; t=Path("translation.log").read_text(errors="replace")[-3500:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
