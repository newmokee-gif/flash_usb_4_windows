name: AppImage

on:
  push:
    tags: ['appimage-v*-linux*']
    paths:
      - packaging/appimage/**
      - прога/linux_gui.py
      - прога/linux_usb.py
      - tests/test_appimage_runtime.py
      - .github/workflows/appimage.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bundled runtime on Debian 12
        run: |
          mkdir -p appimage
          set +e
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/appimage:/out" -w /src debian:bookworm-slim sh -eu -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-tk python3-venv libpython3.11 binutils ca-certificates squashfs-tools file aria2
            python3 -m venv /opt/build-venv
            /opt/build-venv/bin/python -m pip install PyInstaller==6.22.3 certifi==2025.10.5
            /opt/build-venv/bin/python -m unittest discover -s tests -v
            /opt/build-venv/bin/python packaging/appimage/build.py --output /out
          ' 2>&1 | tee appimage-build.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; t=Path("appimage-build.log").read_text(errors="replace")[-3000:]; print("::error::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: appimage/*.AppImage
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian 12
            image: debian:bookworm-slim
            require_no_python: '1'
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              xvfb fonts-dejavu-core util-linux mount parted dosfstools wimtools udev pkexec
              libxft2 libxrender1 libxss1
          - distro: Fedora
            image: fedora:latest
            require_no_python: '0'
            install: >-
              dnf install -y xorg-x11-server-Xvfb dejavu-sans-fonts util-linux parted dosfstools
              wimlib-utils systemd-udev polkit libXft libXrender libXScrnSaver
          - distro: Arch
            image: archlinux:latest
            require_no_python: '0'
            install: >-
              pacman -Syu --noconfirm xorg-server-xvfb ttf-dejavu util-linux parted dosfstools
              wimlib systemd polkit libxft libxrender libxss
    name: AppImage on ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: appimage
      - name: Test bundled CLI, GUI and subprocess restart without FUSE
        env:
          IMAGE: ${{ matrix.image }}
          INSTALL: ${{ matrix.install }}
          REQUIRE_NO_PYTHON: ${{ matrix.require_no_python }}
        run: |
          chmod 755 appimage/*.AppImage
          set +e
          docker run --rm -v "$PWD/appimage:/app:ro" -e INSTALL -e REQUIRE_NO_PYTHON "$IMAGE" sh -eu -c '
            sh -eu -c "$INSTALL"
            cat /etc/os-release
            if command -v python3; then
              if [ "$REQUIRE_NO_PYTHON" = 1 ]; then
                echo "Python-free runtime test unexpectedly has host Python"
                exit 1
              fi
              echo "Host Python present (not used by AppImage)"
            else
              echo "No host Python installed"
            fi
            Xvfb :99 -screen 0 1024x768x24 -nolisten tcp &
            xvfb_pid=$!
            trap "kill $xvfb_pid" EXIT
            export DISPLAY=:99
            runuser -u nobody -- /app/flash-usb-v0.3.4-x86_64.AppImage --appimage-extract-and-run --help
            runuser -u nobody -- /app/flash-usb-v0.3.4-x86_64.AppImage --appimage-extract-and-run check
            runuser -u nobody -- /app/flash-usb-v0.3.4-x86_64.AppImage --appimage-extract-and-run list
            runuser -u nobody -- /app/flash-usb-v0.3.4-x86_64.AppImage --appimage-extract-and-run --self-test
            /app/flash-usb-v0.3.4-x86_64.AppImage --appimage-extract-and-run --self-test
          ' 2>&1 | tee appimage-test.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; t=Path("appimage-test.log").read_text(errors="replace")[-3000:]; print("::error::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$result"

  publish:
    if: startsWith(github.ref, 'refs/tags/appimage-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: appimage
      - name: Publish verified AppImage alongside existing installers
        working-directory: appimage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME#appimage-}"
          gh release view "$release"
          chmod 755 *.AppImage
          sha256sum *.AppImage > SHA256SUMS-AppImage.txt
          gh release upload "$release" *.AppImage SHA256SUMS-AppImage.txt
          gh release view "$release" --json body --jq .body > release-notes.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('release-notes.md')
          p.write_text(p.read_text() + '''

          ## AppImage (x86_64)

          Download `flash-usb-v0.3.4-x86_64.AppImage`, then:

          ```sh
          chmod +x flash-usb-v0.3.4-x86_64.AppImage
          ./flash-usb-v0.3.4-x86_64.AppImage
          ```

          Without FUSE: add `--appimage-extract-and-run` to the command.
          Python and Tk are bundled; glibc 2.36+ and a graphical Linux desktop are required.
          Disk tools remain system dependencies (use `--appimage-extract-and-run check` to inspect).
          Debian: `sudo apt install util-linux mount parted dosfstools wimtools udev pkexec fonts-dejavu-core`
          Fedora: `sudo dnf install util-linux parted dosfstools wimlib-utils systemd-udev polkit dejavu-sans-fonts`
          Arch: `sudo pacman -Syu --needed util-linux parted dosfstools wimlib systemd polkit ttf-dejavu`
          CLI/GUI and process restart were tested in Debian 12, Fedora and Arch without FUSE.
          Interactive polkit authorization and physical USB writing/boot still require hardware testing.
          Checksums: `SHA256SUMS-AppImage.txt`.
          ''')
          PY
          gh release edit "$release" --notes-file release-notes.md
